<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- "any"-Variante von icon.svg fuer Plattformen ohne eigenes Icon-Masking
       (z.B. Windows-Desktopverknuepfung von installierten PWAs): der schwarze
       Untergrund ist hier ein Kreis statt eines randlosen Quadrats, damit das
       Icon dort - wie bei anderen Apps ueblich - rund statt eckig erscheint.
       Serviceplan-Zeichen, Orbit und Funke unveraendert wie in icon.svg. -->
