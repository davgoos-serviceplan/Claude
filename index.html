<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Process- & AI-Usecase Management</title>
  <meta name="description" content="Prozesse dokumentieren, auf AI-Potenzial prüfen und AI-Use-Cases erfassen, bewerten und ausarbeiten." />
  <meta name="theme-color" content="#047857" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Process & AI" />
  <script>
    // Vor dem ersten Rendern setzen, damit die Seite nicht kurz im falschen
    // Modus aufblitzt, bevor js/app.js geladen ist. Ohne gespeicherte
    // Präferenz richtet sich der Default nach der Tageszeit (hell 5-21 Uhr,
    // dunkel 22-4 Uhr) - muss zu timeDefaultTheme() in js/app.js passen.
    try {
      (function () {
        var storedTheme = localStorage.getItem("ai_ideen_theme");
        var theme;
        if (storedTheme === "light" || storedTheme === "dark") {
          theme = storedTheme;
        } else {
          var h = new Date().getHours();
          theme = h >= 5 && h < 22 ? "light" : "dark";
        }
        if (theme === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
      let reloadedForUpdate = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloadedForUpdate) return;
        reloadedForUpdate = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
